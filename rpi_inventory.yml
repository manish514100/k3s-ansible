---
k3s_cluster:
  children:
    server:
      hosts:
        192.168.16.13:
    agent:
      hosts:
        192.168.16.14:
        192.168.16.15:
        192.168.16.16:
        192.168.16.17:

  # Required Vars
  vars:
    ansible_port: 22
    ansible_user: manish
    k3s_version: v1.33.2+k3s1
    token: "changeme!"
    api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"

    cluster_context: k3s

    server_config_yaml:  |
      disable:
        - traefik
        - servicelb
